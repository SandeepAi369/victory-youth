name: Bug report
description: Something is broken or behaves unexpectedly.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! **Security issues must not be reported here** — use the private form in the Security tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally reproducible with `npm run demo` (fake data, no accounts).
      placeholder: |
        1. Run `npm run demo`
        2. Open /admin/chanda
        3. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public website
        - Admin panel
        - Chanda / Donations / Members (money sections)
        - Setup / demo / deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - Demo (`npm run demo`)
        - Local development
        - My own deployment
        - Live site
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device / OS
      placeholder: Chrome 140 on Android 15
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Paste error messages or drag screenshots here. Remove any private data first.
